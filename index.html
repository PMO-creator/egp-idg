<style>
:root{
  --ink:#101B2C;
  --ink-soft:#4B5A70;
  --ink-faint:#8896A8;
  --paper:#F2F4F8;
  --card:#FFFFFF;
  --line:#D8DEE7;
  --accent:#2554D6;
  --accent-soft:#E3EAFB;
  --bronze:#B07C35;
  --bronze-soft:#F4E8D5;
  --radius:12px;
  --badge-docs:#2554D6;
  --badge-slides:#B07C35;
  --badge-sheets:#1E8A6E;
  --badge-form:#7C4FD1;
  --badge-github:#46536B;
  --badge-pendente:#94A0B2;
  --badge-powerbi:#B07C35;
  --badge-pdf:#C4432E;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--paper);
  color:var(--ink);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:'Space Grotesk','Inter',sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:0 24px}

/* ── Header ── */
header{
  background:var(--ink);
  background-image:
    linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px),
    linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
  background-size:28px 28px;
  color:#fff;
  padding:22px 0;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 1px 0 rgba(0,0,0,.25);
}
.header-in{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.logo{flex:0 0 auto}
.logo svg{height:40px;width:auto;display:block}
.logo svg .st0{fill:#FFFFFF}
.header-txt{flex:1 1 auto;min-width:200px}
.header-txt h1{font-size:19px;font-weight:600;letter-spacing:-.01em}
.header-txt p{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.03em;color:#8896A8;margin-top:3px;text-transform:uppercase}
.header-drive{
  flex:0 0 auto;background:var(--bronze);color:#fff;text-decoration:none;font-weight:600;font-size:13px;
  padding:8px 16px;border-radius:999px;white-space:nowrap;transition:.15s;
}
.header-drive:hover{background:#96692B}

/* ── Onda de fases ── */
.wave-wrap{background:var(--paper);padding:36px 0 8px;overflow-x:auto}
.wave-lead{max-width:60ch;margin:0 auto 26px;text-align:center}
.wave-kicker{
  font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;
  letter-spacing:.09em;text-transform:uppercase;color:var(--bronze);margin-bottom:8px;
}
.wave-title{font-size:22px;font-weight:650;letter-spacing:-.01em;margin-bottom:6px}
.wave-sub{color:var(--ink-soft);font-size:14.5px}
.wave{position:relative;width:100%;max-width:1000px;min-width:640px;margin:0 auto;aspect-ratio:1000/300}
.wave svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.wave-node{
  position:absolute;transform:translate(-50%,-50%);
  width:132px;height:132px;border-radius:50%;
  background:var(--card);
  box-shadow:0 10px 24px rgba(16,27,44,.16), 0 0 0 6px var(--paper);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  text-align:center;padding:10px;text-decoration:none;color:var(--ink);
  transition:.15s;
}
.wave-node:hover{box-shadow:0 14px 30px rgba(16,27,44,.22), 0 0 0 6px var(--paper);transform:translate(-50%,-50%) scale(1.04)}
.wave-node.ativo{box-shadow:0 0 0 3px var(--accent), 0 14px 30px rgba(16,27,44,.22), 0 0 0 8px var(--paper)}
.wave-node-num{
  font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--ink-faint);
  letter-spacing:.06em;
}
.wave-node-label{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;line-height:1.2;letter-spacing:-.01em}

@media(max-width:640px){
  .wave-title{font-size:19px}
}

/* ── Fluxo (espinha central) ── */
.fluxo{position:relative;padding:32px 0 8px}
.fluxo::before{
  content:'';position:absolute;left:32px;top:0;bottom:0;width:2px;
  background:linear-gradient(to bottom,
    transparent 0,
    var(--accent) 30px,
    var(--accent) calc(100% - 30px),
    transparent 100%);
}
.fluxo::after{
  content:'';position:absolute;left:31px;top:0;bottom:0;width:4px;
  background:repeating-linear-gradient(to bottom,
    rgba(37,84,214,.35) 0, rgba(37,84,214,.35) 3px,
    transparent 3px, transparent 14px);
  background-size:4px 56px;
  animation:fluxoFlow 5s linear infinite;
  mask-image:linear-gradient(to bottom, transparent 0, black 30px, black calc(100% - 30px), transparent 100%);
  -webkit-mask-image:linear-gradient(to bottom, transparent 0, black 30px, black calc(100% - 30px), transparent 100%);
}
@keyframes fluxoFlow{from{background-position-y:0}to{background-position-y:56px}}
@media(prefers-reduced-motion:reduce){.fluxo::after{animation:none}}

.fase-secao{margin-bottom:8px}

.fase-header-row{display:flex;align-items:center;gap:24px;margin-bottom:22px}
.fase-secao:not(:first-child) .fase-header-row{margin-top:12px}
.fase-head h2{margin:0}
.fase-pill{
  display:inline-block;background:var(--fase-cor, var(--bronze));color:#fff;
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;letter-spacing:.02em;
  padding:5px 14px;border-radius:999px;margin-bottom:6px;
}
.fase-head p{color:var(--ink-soft);font-size:13.5px;margin-top:2px}

.step-row{display:flex;align-items:center;gap:24px;margin-bottom:16px}

.fluxo-divisor-row{display:flex;align-items:center;gap:24px;margin:6px 0 30px}
.fluxo-divisor{
  font-size:13.5px;font-weight:600;color:var(--ink-soft);
  display:flex;align-items:center;gap:8px;
}
.fluxo-divisor span{color:var(--bronze)}

.rail-slot{flex:0 0 64px;display:flex;justify-content:center;position:relative;z-index:2}

.rail-node{
  width:42px;height:42px;border-radius:50%;
  background:var(--card);border:2px solid var(--accent);color:var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;
  box-shadow:0 0 0 5px var(--paper);
}
.rail-node--fase{
  width:58px;height:58px;background:var(--fase-cor, var(--bronze));border-color:var(--fase-cor, var(--bronze));color:#fff;
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;
  box-shadow:0 0 0 6px var(--paper);
}
.rail-node.is-pendente{border-color:var(--badge-pendente);color:var(--badge-pendente);border-style:dashed}

/* ── Card de etapa ── */
.step-card{
  flex:1 1 auto;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px 20px;
  display:flex;flex-direction:column;gap:5px;
  text-decoration:none;color:inherit;
  transition:.15s;
}
.step-card:hover{border-color:var(--accent);box-shadow:0 6px 16px rgba(16,27,44,.09);transform:translateX(3px)}
.step-card-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.step-icone{font-size:22px;line-height:1}
.badge{
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  color:#fff;padding:3px 9px;border-radius:999px;white-space:nowrap;flex:0 0 auto;
}
.badge.docs{background:var(--badge-docs)}
.badge.slides{background:var(--badge-slides)}
.badge.sheets{background:var(--badge-sheets)}
.badge.form{background:var(--badge-form)}
.badge.github{background:var(--badge-github)}
.badge.pendente{background:var(--badge-pendente)}
.badge.powerbi{background:var(--badge-powerbi)}
.badge.pdf{background:var(--badge-pdf)}
.step-nome{font-size:15px;font-weight:650;letter-spacing:-.01em}
.step-desc{font-size:13px;color:var(--ink-soft)}
.step-acao{
  font-size:12.5px;font-weight:600;color:var(--accent);
  display:flex;align-items:center;gap:4px;margin-top:2px;
}
.step-card:hover .step-acao{gap:8px}
.step-nota{font-size:11px;color:var(--ink-faint);font-style:italic}

.step-card.is-pendente{background:var(--paper);border-style:dashed;cursor:default}
.step-card.is-pendente:hover{border-color:var(--line);box-shadow:none;transform:none}
.step-card.is-pendente .step-nome,.step-card.is-pendente .step-desc{color:var(--ink-faint)}
.step-card.is-pendente .step-icone{opacity:.5}
.step-card.is-pendente .step-acao{color:var(--ink-faint)}

/* ── Apoio (fora do fluxo) ── */
.apoio-secao{
  margin-top:16px;padding:28px 24px;
  background:var(--card);border:1px dashed var(--line);border-radius:16px;
}
.apoio-head{margin-bottom:18px}
.apoio-tag{
  display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;
  letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);
  background:var(--paper);border:1px solid var(--line);border-radius:999px;
  padding:3px 10px;margin-bottom:10px;
}
.apoio-head h2{font-size:19px;font-weight:650}
.apoio-head p{color:var(--ink-soft);font-size:13.5px;margin-top:3px}
.apoio-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.apoio-card{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;display:flex;flex-direction:column;gap:5px;
  text-decoration:none;color:inherit;transition:.15s;
}
.apoio-card:hover{border-color:var(--bronze);box-shadow:0 6px 16px rgba(16,27,44,.08);transform:translateY(-2px)}
.apoio-card.is-pendente{cursor:default}
.apoio-card.is-pendente:hover{border-color:var(--line);box-shadow:none;transform:none}

/* ── Rodapé ── */
footer{margin-top:48px;padding:26px 0 40px;border-top:1px solid var(--line)}
.footer-in{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
footer a{color:var(--accent);text-decoration:none;font-size:13.5px;font-weight:600}
footer a:hover{text-decoration:underline}
footer small{color:var(--ink-faint);font-size:12px;font-family:'IBM Plex Mono',monospace}

/* ── Toast ── */
#toast{
  position:fixed;left:50%;bottom:32px;transform:translate(-50%,16px);
  background:var(--ink);color:#fff;font-size:13.5px;
  padding:13px 22px;border-radius:var(--radius);
  box-shadow:0 8px 24px rgba(16,27,44,.3);
  opacity:0;pointer-events:none;transition:.2s;z-index:200;
}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ── Responsivo ── */
@media(max-width:640px){
  .wrap{padding:0 16px}
  .header-in{gap:12px}
  .logo svg{height:32px}
  .header-txt h1{font-size:16px}
  .header-txt p{display:none}
  .header-drive{font-size:12px;padding:7px 12px}
  .fase-pill{font-size:12px;padding:4px 12px}
  .rail-slot{flex:0 0 44px}
  .rail-node{width:34px;height:34px;font-size:11px}
  .rail-node--fase{width:44px;height:44px;font-size:15px}
  .fluxo::before,.fluxo::after{left:22px}
  .step-row,.fase-header-row,.fluxo-divisor-row{gap:14px}
  .apoio-secao{padding:22px 18px}
}
</style>
</head>

<section class="wave-wrap">

    <p class="wave-sub">Toque em uma fase para ir direto aos documentos daquela etapa</p>

  <div class="wave" id="waveFluxo"></div>
</section>

<main class="wrap" id="painel"></main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ═══════════════════════════════════════════════════════════

   tipo:  docs | slides | sheets | form | github | pendente
   modo:  texto exibido no card sobre o que acontece ao clicar
   ═══════════════════════════════════════════════════════════ */

  matriz: {

  },
  tap: {

  },
  eap: {

    icone:'🌳', tipo:'github', modo:'leitura', passo:7,
    url:'https://pmo-creator.github.io/maz-dashboard/EAP/EAP_MAZ_2026_v1.html'
  },
  governanca: {

    desc:'Define a estrutura de governança do projeto',

    url:'https://docs.google.com/presentation/d/14m-H_s2I6azGwfkdmBIYUizW5aUL9IgKtKRXfK7Nd5o/edit'
  },
  cronograma: {
    nome:'Cronograma',
    desc:'Planilha de datas, responsáveis e status das entregas',
    icone:'📅', tipo:'sheets', modo:'edicao', passo:9,
    url:'https://docs.google.com/spreadsheets/d/17nttJ_ShqWztvDWH3l59iNqboLqkviZs3_PM5J3ihdA/edit?gid=1451384064#gid=1451384064'
  },
  dashboard: {
    nome:'Dashboard de Acompanhamento',
    desc:'Painel de acompanhamento do cronograma e das requisições',

  },
  orcamento: {
    nome:'Orçamento',
    desc:'Planilha de controle orçamentário do projeto',
    icone:'💰', tipo:'sheets', modo:'edicao', passo:11,
    url:'https://docs.google.com/spreadsheets/d/1DkZkCu3KryfBAGlqU8lismX4vvOhV3-WYDSEVzm5ROE/edit?gid=638686800#gid=638686800'
  },
  dashboardOrcamento: {
    nome:'Dashboard de Orçamento',
    desc:'Painel de acompanhamento do orçamento do projeto',
    icone:'💹', tipo:'github', modo:'leitura', passo:12,
    url:'https://sergiomendesgovrj.github.io/MAZ-Painel-Financeiro/MAZ%20Painel%20Financeiro.html?v=2'
  },
  requisicoes: {
    nome:'Requisições de Compras',
    desc:'Planilha de status das requisições de compras do projeto',
    icone:'🛒', tipo:'sheets', modo:'edicao',
    url:'https://docs.google.com/spreadsheets/d/1azrdS4OGO-CWD1ods69i8iZJcwq4oyISdT2n_tu1uJM/edit?gid=807629347#gid=807629347'
  },
  encerramento: {
    nome:'TEP - Termo de Encerramento',
    desc:'Formulário de fechamento com lições aprendidas',
    icone:'✅', tipo:'form', modo:'preencher', passo:13,
    url:'https://docs.google.com/forms/d/e/1FAIpQLSfCdvuDSs9wOpyRjmKQxUYeYLDMWa9iNnB7r6FQgCEnhzoFVg/viewform'
  }
};

const PASTA_DRIVE = 'https://drive.google.com/drive/folders/1BI_90zsQ3qYxtsCK5bfD9yMsYXn5SIoO';

const SECOES = [
  {
    id:'priorizacao', num:'1', titulo:'Priorização de Iniciativas',
    sub:'Avaliação e seleção de novas iniciativas antes da aprovação',
    colunas:[ {titulo:null, docs:['avaliacao','matriz','parecerTecnico','propostaTecnica']} ],
    divisor:'Conclua a Priorização para avançar ao Planejamento'
  },
  {
    id:'planejamento', num:'2', titulo:'Planejamento',
    sub:'Estruturação da equipe e do escopo do projeto aprovado',
    colunas:[ {titulo:null, docs:['cargos','tap','eap','governanca']} ],
    divisor:'Conclua o Planejamento para avançar à Execução'
  },
  {
    id:'execucao', num:'3', titulo:'Execução - Cronograma Físico-Financeiro',
    sub:'Acompanhamento do cronograma e das entregas em andamento',
    colunas:[ {titulo:null, docs:['cronograma','dashboard','orcamento','dashboardOrcamento']} ],
    divisor:'Conclua a Execução para avançar ao Encerramento'
  },
  {
    id:'encerramento', num:'4', titulo:'Encerramento',
    sub:'Formalização do fechamento do projeto e lições aprendidas',
    colunas:[ {titulo:null, docs:['encerramento']} ]
  }
];


/* ═══ Render — não precisa editar daqui para baixo ═══ */

const ROTULO_TIPO = {
  docs:'Docs', slides:'Slides', sheets:'Sheets',
  form:'Formulário', github:'Web', pendente:'Em elaboração',
  powerbi:'Power BI', pdf:'PDF'
};

const NOTA_MODO = {
  copia:'abre uma cópia para você preencher',
  edicao:'abre o arquivo em uso pela equipe',
  leitura:'', preencher:'', '':''
};

function escH(s){
  return String(s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}

const FASE_PALETA = ['#1E8A6E', '#7C4FD1', '#2554D6', '#B07C35'];
function corFase(i){
  return FASE_PALETA[i % FASE_PALETA.length];
}

function rotuloCurto(titulo){
  return titulo.split(' - ')[0];
}

function construirOndaSVG(){
  const n = SECOES.length;
  if(n === 0) return { svg: '', nos: '' };
  const W = 1000, H = 300;
  const margem = 110;
  const espaco = n > 1 ? (W - margem * 2) / (n - 1) : 0;
  const cy = H / 2;
  const raioAnel = 92;
  const toRad = d => d * Math.PI / 180;
  const ponto = (cx, ang) => [cx + raioAnel * Math.cos(toRad(ang)), cy + raioAnel * Math.sin(toRad(ang))];

  let arcosSVG = '';
  let nosHTML = '';

  SECOES.forEach((sec, i) => {
    const cx = margem + espaco * i;
    const cor = corFase(i);
    const paraCima = i % 2 === 1;
    const pathId = `arcoFase${i}`;
    let p1, p2, sweep;
    if(!paraCima){
      p1 = ponto(cx, 160); p2 = ponto(cx, 20); sweep = 0; // esquerda → direita, por baixo
    } else {
      p1 = ponto(cx, 200); p2 = ponto(cx, 340); sweep = 1; // esquerda → direita, por cima
    }
    arcosSVG += `
      <path id="${pathId}" d="M ${p1[0].toFixed(1)} ${p1[1].toFixed(1)} A ${raioAnel} ${raioAnel} 0 0 ${sweep} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}"
        fill="none" stroke="${cor}" stroke-width="24" stroke-linecap="round"/>
      <text font-family="Space Grotesk, sans-serif" font-weight="700" font-size="13" letter-spacing="1.5" fill="#ffffff">
        <textPath href="#${pathId}" startOffset="50%" text-anchor="middle" dy="5">${escH(sec.titulo.toUpperCase())}</textPath>
      </text>`;

    const leftPct = (cx / W * 100).toFixed(2);
    const topPct = (cy / H * 100).toFixed(2);
    nosHTML += `<a href="#${sec.id}" class="wave-node" style="left:${leftPct}%;top:${topPct}%">
      <span class="wave-node-num">Etapa ${sec.num}</span>
      <span class="wave-node-label">${escH(rotuloCurto(sec.titulo))}</span>
    </a>`;
  });

  const svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">${arcosSVG}</svg>`;
  return { svg, nos: nosHTML };
}

function railSlot(inner){
  return `<div class="rail-slot">${inner}</div>`;
}

function railNode(label, opts = {}){
  const cls = ['rail-node'];
  if(opts.fase) cls.push('rail-node--fase');
  if(opts.pendente) cls.push('is-pendente');
  return `<div class="${cls.join(' ')}"><span>${escH(label)}</span></div>`;
}

function cardMiolo(d){
  const badge = `<span class="badge ${d.tipo}">${escH(ROTULO_TIPO[d.tipo] || d.tipo)}</span>`;
  const nota  = NOTA_MODO[d.modo] ? `<span class="step-nota">${escH(NOTA_MODO[d.modo])}</span>` : '';
  return `
      <div class="step-card-top"><span class="step-icone">${d.icone}</span>${badge}</div>
      <span class="step-nome">${escH(d.nome)}</span>
      <span class="step-desc">${escH(d.desc)}</span>
      ${nota}`;
}

function stepCardHTML(chave){
  const d = DOCS[chave];
  if(!d) return '';
  const miolo = cardMiolo(d);
  if(d.tipo === 'pendente' || !d.url){
    return `<div class="step-card is-pendente" data-pendente="1" tabindex="0" role="button">
      ${miolo}
      <span class="step-acao">Em elaboração</span>
    </div>`;
  }
  return `<a class="step-card" href="${escH(d.url)}" target="_blank" rel="noopener">
      ${miolo}
      <span class="step-acao">Abrir <span aria-hidden="true">→</span></span>
    </a>`;
}

function apoioCardHTML(chave){
  const d = DOCS[chave];
  if(!d) return '';
  const miolo = cardMiolo(d);
  if(d.tipo === 'pendente' || !d.url){
    return `<div class="apoio-card is-pendente" data-pendente="1" tabindex="0" role="button">
      ${miolo}
      <span class="step-acao">Em elaboração</span>
    </div>`;
  }
  return `<a class="apoio-card" href="${escH(d.url)}" target="_blank" rel="noopener">
      ${miolo}
      <span class="step-acao">Abrir <span aria-hidden="true">→</span></span>
    </a>`;
}

function stepRowHTML(chave){
  const d = DOCS[chave];
  if(!d) return '';
  const numero = d.passo ? String(d.passo).padStart(2,'0') : '•';
  const pendente = d.tipo === 'pendente' || !d.url;
  return `<div class="step-row">
    ${railSlot(railNode(numero, { pendente }))}
    ${stepCardHTML(chave)}
  </div>`;
}

function faseHeaderHTML(sec){
  return `<div class="fase-header-row">
    ${railSlot(railNode(sec.num, { fase:true }))}
    <div class="fase-head">
      <h2><span class="fase-pill">${escH(sec.titulo)}</span></h2>
      <p>${escH(sec.sub)}</p>
    </div>
  </div>`;
}

function divisorRowHTML(msg){
  return `<div class="fluxo-divisor-row">
    ${railSlot('')}
    <p class="fluxo-divisor"><span aria-hidden="true">↓</span> ${escH(msg)}</p>
  </div>`;
}

function renderPainel(){
  const fluxoHTML = SECOES.map((sec, i) => {
    const cor = corFase(i);
    const docsFlat = sec.colunas.flatMap(col => col.docs);
    const stepsHTML = docsFlat.map(stepRowHTML).join('');
    const divisorHTML = sec.divisor ? divisorRowHTML(sec.divisor) : '';
    return `<section class="fase-secao" id="${sec.id}" style="--fase-cor:${cor}">
      ${faseHeaderHTML(sec)}
      ${stepsHTML}
      ${divisorHTML}
    </section>`;
  }).join('');

  const apoioHTML = `<section class="apoio-secao" id="apoio">
      <div class="apoio-head">
        <span class="apoio-tag">Fora do fluxo</span>
        <h2>Arquivos de Apoio</h2>
        <p>Material de referência do Escritório de Projetos — consulte quando precisar</p>
      </div>
      <div class="apoio-grid">${['popEgp','manualPop','requisicoes'].map(apoioCardHTML).join('')}</div>
    </section>`;

  const onda = construirOndaSVG();
  document.getElementById('waveFluxo').innerHTML = onda.svg + onda.nos;

  document.getElementById('painel').innerHTML = `
    <div class="fluxo">${fluxoHTML}</div>
    ${apoioHTML}
    <footer>
      <div class="footer-in">
        <a href="${escH(PASTA_DRIVE)}" target="_blank" rel="noopener">
          Ver todos os documentos no Drive →
        </a>
        <small>Escritório de Gestão de Projetos · IDG</small>
      </div>
    </footer>`;
}

let toastTimer = null;
function mostrarToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 2600);
}

document.addEventListener('click', e => {
  if(e.target.closest('[data-pendente]')){
    mostrarToast('Documento em elaboração — em breve disponível');
  }
});

document.addEventListener('keydown', e => {
  if((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-pendente]')){
    e.preventDefault();
    mostrarToast('Documento em elaboração — em breve disponível');
  }
});

document.getElementById('navDrive').href = PASTA_DRIVE;
renderPainel();

const navSecoes = ['priorizacao','planejamento','execucao','encerramento','apoio']
  .map(id => ({ id, link: document.querySelector(`.wave-node[href="#${id}"]`), el: document.getElementById(id) }))
  .filter(s => s.link && s.el);

if(navSecoes.length){
  const scrollSpy = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if(!entry.isIntersecting) return;
      const alvo = navSecoes.find(s => s.el === entry.target);
      if(!alvo) return;
      navSecoes.forEach(s => s.link.classList.remove('ativo'));
      alvo.link.classList.add('ativo');
    });
  }, { rootMargin: '-110px 0px -70% 0px', threshold: 0 });
  navSecoes.forEach(s => scrollSpy.observe(s.el));

  const ultimoNav = navSecoes[navSecoes.length - 1];
  window.addEventListener('scroll', () => {
    const chegouAoFim = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2;
    if(!chegouAoFim) return;
    navSecoes.forEach(s => s.link.classList.remove('ativo'));
    ultimoNav.link.classList.add('ativo');
  }, { passive:true });
}
</script>
