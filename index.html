<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escritório de Projetos · IDG</title>
<style>
:root{
  --bg:#1E293B;
  --accent:#3B82F6;
  --card:#FFFFFF;
  --surface:#F1F5F9;
  --border:#E2E8F0;
  --text:#1E293B;
  --muted:#64748B;
  --radius:10px;
  --gap:32px;
  --badge-docs:#2563EB;
  --badge-slides:#EA580C;
  --badge-sheets:#16A34A;
  --badge-form:#7C3AED;
  --badge-github:#334155;
  --badge-pendente:#94A3B8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--surface);
  color:var(--text);
  line-height:1.5;
}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}

/* ── Header ── */
header{
  background:var(--bg);
  color:#fff;
  padding:20px 0;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.header-in{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.logo{flex:0 0 auto}
.logo svg{height:44px;width:auto;display:block}
.logo svg .st0{fill:#FFFFFF}
.header-txt{flex:1 1 auto;min-width:200px}
.header-txt h1{font-size:20px;font-weight:600;letter-spacing:-.01em}
.header-txt p{font-size:13px;color:#94A3B8;margin-top:2px}
.nav{display:flex;gap:8px;flex:0 0 auto}
.nav a{
  color:#0F172A;
  background:#DBEAFE;
  text-decoration:none;
  font-size:13px;
  padding:6px 14px;
  border-radius:999px;
  border:1px solid transparent;
  transition:.15s;
}
.nav a:hover{background:#BFDBFE}
.nav a.ativo{background:var(--accent);color:#fff;font-weight:600}
.nav a.ativo:hover{background:#2563EB}
.nav a.nav-drive{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.nav a.nav-drive:hover{background:#2563EB;border-color:#2563EB}

/* ── Seções ── */
.secao{padding:48px 0 8px}
.secao-head{display:flex;align-items:baseline;gap:12px;margin-bottom:8px}
.secao-num{
  font-size:13px;font-weight:700;color:#fff;background:var(--bg);
  width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.secao h2{font-size:24px;font-weight:650;letter-spacing:-.02em}
.secao-sub{color:var(--muted);font-size:14px;margin:0 0 24px 38px}
.secao-icone{font-size:18px;width:26px;text-align:center;flex:0 0 auto}

/* ── Divisor de fluxo ── */
.flow-divider{display:flex;align-items:center;gap:16px;margin-top:8px}
.flow-divider-line{flex:1 1 auto;height:1px;background:var(--border)}
.flow-divider-msg{
  display:flex;align-items:center;gap:10px;flex:0 1 auto;text-align:center;
  font-size:16px;font-weight:600;color:var(--muted);
}
.flow-divider-arrow{
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  width:40px;height:40px;border-radius:50%;
  background:var(--accent);color:#fff;font-size:20px;
  animation:flowBounce 1.6s ease-in-out infinite;
}
@keyframes flowBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}

/* ── Colunas ── */
.colunas{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap);align-items:start}
.coluna-head{
  font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  color:var(--muted);padding-bottom:10px;margin-bottom:16px;
  border-bottom:2px solid var(--border);
}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.coluna .grid{grid-template-columns:1fr}
#priorizacao .grid,#execucao .grid{grid-template-columns:repeat(3,1fr)}

/* ── Card ── */
.card{
  position:relative;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:20px;
  display:flex;flex-direction:column;gap:8px;
  text-decoration:none;color:inherit;
  transition:.15s;
  min-height:150px;
}
.card:hover{
  border-color:var(--accent);
  box-shadow:0 4px 12px rgba(30,41,59,.10);
  transform:translateY(-2px);
}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.card-icone{font-size:26px;line-height:1}
.badge{
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  color:#fff;padding:3px 9px;border-radius:999px;white-space:nowrap;
}
.badge.docs{background:var(--badge-docs)}
.badge.slides{background:var(--badge-slides)}
.badge.sheets{background:var(--badge-sheets)}
.badge.form{background:var(--badge-form)}
.badge.github{background:var(--badge-github)}
.badge.pendente{background:var(--badge-pendente)}
.card-nome{font-size:15px;font-weight:600;letter-spacing:-.01em}
.card-desc{font-size:13px;color:var(--muted);flex:1 1 auto}
.card-acao{
  font-size:13px;font-weight:600;color:var(--accent);
  display:flex;align-items:center;gap:5px;margin-top:4px;
}
.card:hover .card-acao{gap:9px}
.card-nota{font-size:11px;color:var(--muted);font-style:italic}

/* ── Fluxo numerado (etapas 1–7) ── */
.flow-badge{
  position:absolute;top:-14px;left:-14px;z-index:2;
  width:28px;height:28px;border-radius:50%;
  background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;
  box-shadow:0 0 0 3px var(--surface);
}
.card.pendente .flow-badge{background:var(--badge-pendente)}
@media(min-width:901px){
  .grid .card[data-passo] + .card[data-passo]:not(:nth-child(3n+1))::before{
    content:'';position:absolute;z-index:1;
    top:-1px;left:-20px;width:20px;height:2px;
    background:var(--accent);
  }
  .grid .card[data-passo] + .card.pendente[data-passo]:not(:nth-child(3n+1))::before{
    background:var(--badge-pendente);
  }
}

/* ── Card pendente ── */
.card.pendente{background:var(--surface);border-style:dashed;cursor:default}
.card.pendente:hover{border-color:var(--border);box-shadow:none;transform:none}
.card.pendente .card-nome,.card.pendente .card-desc{color:var(--muted)}
.card.pendente .card-icone{opacity:.5}
.card.pendente .card-acao{color:var(--muted)}

/* ── Rodapé ── */
footer{margin-top:56px;padding:28px 0 40px;border-top:1px solid var(--border)}
.footer-in{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
footer a{color:var(--accent);text-decoration:none;font-size:14px;font-weight:500}
footer a:hover{text-decoration:underline}
footer small{color:var(--muted);font-size:12px}

/* ── Toast ── */
#toast{
  position:fixed;left:50%;bottom:32px;transform:translate(-50%,16px);
  background:var(--bg);color:#fff;font-size:14px;
  padding:13px 22px;border-radius:var(--radius);
  box-shadow:0 8px 24px rgba(30,41,59,.28);
  opacity:0;pointer-events:none;transition:.2s;z-index:200;
}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ── Responsivo ── */
@media(max-width:900px){
  .colunas{grid-template-columns:1fr;gap:36px}
  #priorizacao .grid,#execucao .grid{grid-template-columns:1fr}
  .flow-divider-msg{font-size:15px}
  .secao{padding:36px 0 8px}
}
@media(max-width:600px){
  .wrap{padding:0 16px}
  .header-in{gap:14px}
  .logo svg{height:34px}
  .header-txt h1{font-size:17px}
  .header-txt p{display:none}
  .nav{width:100%}
  .nav a{flex:1;text-align:center}
  .secao h2{font-size:20px}
  .secao-sub{margin-left:0}
}
</style>

const ROTULO_TIPO = {
  docs:'Docs', slides:'Slides', sheets:'Sheets',
  form:'Formulário', github:'Web', pendente:'Em elaboração'
};

const NOTA_MODO = {
  copia:'abre uma cópia para você preencher',
  edicao:'abre o arquivo em uso pela equipe',
  leitura:'', preencher:'', '':''
};

function escH(s){
  return String(s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}

function cardHTML(chave){
  const d = DOCS[chave];
  if(!d) return '';
  const badge = `<span class="badge ${d.tipo}">${escH(ROTULO_TIPO[d.tipo] || d.tipo)}</span>`;
  const nota  = NOTA_MODO[d.modo] ? `<span class="card-nota">${escH(NOTA_MODO[d.modo])}</span>` : '';
  const passo = d.passo ? `<span class="flow-badge" aria-label="Etapa ${d.passo}">${d.passo}</span>` : '';
  const dataPasso = d.passo ? ` data-passo="${d.passo}"` : '';

  const miolo = `
      <div class="card-top"><span class="card-icone">${d.icone}</span>${badge}</div>
      <span class="card-nome">${escH(d.nome)}</span>
      <span class="card-desc">${escH(d.desc)}</span>
      ${nota}`;

  if(d.tipo === 'pendente' || !d.url){
    return `<div class="card pendente"${dataPasso} data-pendente="1" tabindex="0" role="button">
      ${passo}${miolo}
      <span class="card-acao">Em elaboração</span>
    </div>`;
  }
  return `<a class="card"${dataPasso} href="${escH(d.url)}" target="_blank" rel="noopener">
      ${passo}${miolo}
      <span class="card-acao">Abrir <span aria-hidden="true">→</span></span>
    </a>`;
}

const FLOW_DIVIDER = `
  <div class="flow-divider" role="separator" aria-label="Conclua a Priorização para avançar à Execução">
    <span class="flow-divider-line"></span>
    <span class="flow-divider-msg">
      <span class="flow-divider-arrow" aria-hidden="true">↓</span>
      Conclua a Priorização para avançar à Execução
    </span>
    <span class="flow-divider-line"></span>
  </div>`;

function renderPainel(){
  const html = SECOES.map(sec => {
    const temColunas = sec.colunas.length > 1 || sec.colunas[0].titulo;
    const corpo = temColunas
      ? `<div class="colunas">${sec.colunas.map(col => `
          <div class="coluna">
            <div class="coluna-head">${escH(col.titulo)}</div>
            <div class="grid">${col.docs.map(cardHTML).join('')}</div>
          </div>`).join('')}</div>`
      : `<div class="grid">${sec.colunas[0].docs.map(cardHTML).join('')}</div>`;

    const secaoHTML = `<section class="secao" id="${sec.id}">
      <div class="secao-head">
        <span class="secao-num">${sec.num}</span>
        <h2>${escH(sec.titulo)}</h2>
      </div>
      <p class="secao-sub">${escH(sec.sub)}</p>
      ${corpo}
    </section>`;

    return sec.id === 'priorizacao' ? secaoHTML + FLOW_DIVIDER : secaoHTML;
  }).join('');

  const apoioHTML = `<section class="secao secao-apoio" id="apoio">
      <div class="secao-head">
        <span class="secao-icone" aria-hidden="true">📎</span>
        <h2>Arquivos de Apoio</h2>
      </div>
      <p class="secao-sub">Material de referência do Escritório de Projetos — consulte quando precisar</p>
      <div class="grid">${['popEgp','manualPop'].map(cardHTML).join('')}</div>
    </section>`;

  document.getElementById('painel').innerHTML = html + apoioHTML + `
    <footer>
      <div class="footer-in">
        <a href="${escH(PASTA_DRIVE)}" target="_blank" rel="noopener">
          Ver todos os documentos no Drive →
        </a>
        <small>Escritório de Gestão de Projetos · IDG</small>
      </div>
    </footer>`;
}

let toastTimer = null;
function mostrarToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 2600);
}

document.addEventListener('click', e => {
  if(e.target.closest('[data-pendente]')){
    mostrarToast('Documento em elaboração — em breve disponível');
  }
});

document.addEventListener('keydown', e => {
  if((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-pendente]')){
    e.preventDefault();
    mostrarToast('Documento em elaboração — em breve disponível');
  }
});

document.getElementById('navDrive').href = PASTA_DRIVE;
renderPainel();

const navSecoes = ['priorizacao','execucao','apoio']
  .map(id => ({ id, link: document.querySelector(`.nav a[href="#${id}"]`), el: document.getElementById(id) }))
  .filter(s => s.link && s.el);

if(navSecoes.length){
  const scrollSpy = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if(!entry.isIntersecting) return;
      const alvo = navSecoes.find(s => s.el === entry.target);
      if(!alvo) return;
      navSecoes.forEach(s => s.link.classList.remove('ativo'));
      alvo.link.classList.add('ativo');
    });
  }, { rootMargin: '-110px 0px -70% 0px', threshold: 0 });
  navSecoes.forEach(s => scrollSpy.observe(s.el));
}
</script>
</body>
</html>
